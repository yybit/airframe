# Cloudflare configuration (Workers Builds, static-assets deploy).
#
# The project is connected to this repo from the Cloudflare dashboard
# (Workers & Pages → Create → import repository). In the build settings:
#   - Root directory (advanced): website
#   - Build command:             (leave empty — the site is pre-built static files)
#   - Project name:              airframe  (must match "name" below)
#
# The build pipeline then runs `wrangler deploy` inside website/ and serves
# this directory as static assets.
#
# Local preview / manual deploy from inside website/:
#   npx wrangler dev .
#   npx wrangler deploy .

name = "airframe"
compatibility_date = "2026-10-12"

[assets]
directory = "."
